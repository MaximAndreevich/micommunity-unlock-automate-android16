name: Nightly property tests

# Random hypothesis examples, many of them, once a day (CI runs fixed ones). A failure
# prints the seed: rerun with it here (Run workflow -> seed) or locally with
#   HYPOTHESIS_PROFILE=nightly python -m pytest tests/test_timing_properties.py --hypothesis-seed=N
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      seed:
        description: hypothesis seed (empty = random)
        required: false

permissions:
  contents: read

jobs:
  properties:
    name: property tests (random seed)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Property tests
        env:
          HYPOTHESIS_PROFILE: nightly
          SEED: ${{ inputs.seed }}
        run: |
          seed="${SEED:-$(python -c 'import random; print(random.getrandbits(32))')}"
          echo "hypothesis seed: $seed"
          echo "hypothesis seed: \`$seed\`" >> "$GITHUB_STEP_SUMMARY"
          python -m pytest -q tests/test_timing_properties.py \
            --hypothesis-seed="$seed" --hypothesis-show-statistics
